<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Review · 书籍逐一审核</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #e6edf3; --text2: #8b949e;
  --blue: #58a6ff; --green: #3fb950; --orange: #f0883e;
  --red: #ff7b72; --yellow: #e3b341;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }

/* ── Landing ── */
#landing {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100vh; gap: 20px;
}
#landing h1 {
  font-size: 2rem; font-weight: 700;
  background: linear-gradient(90deg, var(--blue), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#landing p { color: var(--text2); font-size: .9rem; max-width: 480px; text-align: center; line-height: 1.7; }
.land-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px 32px; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px;
}
.file-row { display: flex; flex-direction: column; gap: 6px; }
.file-row label { font-size: .8rem; color: var(--text2); }
.file-row input[type=file] {
  font-size: .82rem; color: var(--text); background: var(--bg3);
  border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; cursor: pointer; width: 100%;
}
.file-row input[type=file]::file-selector-button {
  background: var(--bg3); color: var(--blue); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: .78rem; margin-right: 8px;
}
.pick-row { display: flex; align-items: center; gap: 10px; }
.pick-btn-sm {
  padding: 7px 14px; font-size: .82rem; font-weight: 600; border: 1px solid var(--border);
  background: var(--bg3); color: var(--blue); border-radius: 6px; cursor: pointer; white-space: nowrap;
  flex-shrink: 0; transition: border-color .15s;
}
.pick-btn-sm:hover { border-color: var(--blue); }
.pick-status { font-size: .78rem; color: var(--text2); }
.pick-status.ok { color: var(--green); }
.land-btn {
  padding: 10px 0; font-size: .92rem; font-weight: 600; border: none;
  border-radius: 8px; cursor: pointer; width: 100%; margin-top: 4px;
  background: linear-gradient(135deg, var(--blue), var(--green)); color: #0d1117;
  transition: opacity .15s;
}
.land-btn:hover { opacity: .85; }
.land-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── Review ── */
#review { display: none; flex-direction: column; height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0;
}
.topbar-title { font-weight: 700; font-size: .88rem; color: var(--text); white-space: nowrap; }
.progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.progress-track { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; min-width: 60px; }
.progress-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width .3s; }
.progress-label { font-size: .78rem; color: var(--text2); white-space: nowrap; }
.topbar-btn {
  padding: 5px 12px; font-size: .78rem; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text2); border-radius: 5px; cursor: pointer; white-space: nowrap;
}
.topbar-btn:hover { border-color: var(--blue); color: var(--blue); }

.book-header {
  padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.book-title { font-size: .95rem; font-weight: 700; color: var(--text); word-break: break-all; line-height: 1.3; }
.book-sub   { font-size: .75rem; color: var(--text2); margin-top: 3px; }
.status-badge {
  flex-shrink: 0; padding: 3px 12px; border-radius: 12px; font-size: .76rem; font-weight: 600; border: 1px solid;
}
.status-keep   { background: rgba(63,185,80,.12);   color: var(--green); border-color: rgba(63,185,80,.35); }
.status-delete { background: rgba(255,123,114,.12); color: var(--red);   border-color: rgba(255,123,114,.35); }

.pairs-area {
  flex: 1; overflow-y: auto; padding: 10px;
  /* block container — no grid/flex compression; cards stack and overflow naturally */
  column-count: auto; column-width: 280px; column-gap: 8px;
}
.pairs-area::-webkit-scrollbar { width: 5px; }
.pairs-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.pair-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; overflow: hidden;
  display: flex; flex-direction: column;
  break-inside: avoid;   /* don't split a card across columns */
  margin-bottom: 8px;
}
.pair-imgs {
  display: flex; gap: 3px; padding: 6px 6px 0 6px;
  overflow-x: auto; overflow-y: visible;
  background: var(--bg2);
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.pair-imgs::-webkit-scrollbar { height: 5px; }
.pair-imgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.pair-imgs img {
  flex: 0 0 auto;
  height: 170px;           /* fixed px — independent of container/scrollbar */
  width: auto; max-width: 300px;
  object-fit: contain; border-radius: 3px; display: block; background: var(--bg3);
}
.pair-text {
  font-size: .72rem; color: var(--text2); padding: 7px 8px; line-height: 1.55;
  border-top: 1px solid var(--border);
  white-space: pre-wrap; word-break: break-all;
}
.pair-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: .72rem; min-height: 60px; }
.pairs-loading { text-align: center; color: var(--text2); font-size: .82rem; padding: 40px 0; }
.pairs-more    { text-align: center; color: var(--text2); font-size: .75rem; padding: 6px 0; font-style: italic; }

.action-bar {
  flex-shrink: 0; padding: 11px 20px; background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.action-btn {
  padding: 9px 26px; font-size: .9rem; font-weight: 700; border: none;
  border-radius: 8px; cursor: pointer; transition: opacity .15s, transform .1s;
}
.action-btn:hover { opacity: .85; transform: translateY(-1px); }
.action-btn:active { transform: translateY(0); }
.btn-delete { background: rgba(255,123,114,.15); color: var(--red);   border: 1px solid rgba(255,123,114,.4); }
.btn-next   { background: linear-gradient(135deg, var(--blue), var(--green)); color: #0d1117; }
.btn-undo   { background: transparent; color: var(--text2); border: 1px solid var(--border); padding: 9px 14px; }
.key-hint   { font-size: .72rem; color: var(--text2); }

/* ── Done ── */
#done {
  display: none; flex-direction: column; align-items: center;
  justify-content: center; height: 100vh; gap: 20px;
}
#done h1 {
  font-size: 1.8rem; font-weight: 700;
  background: linear-gradient(90deg, var(--green), var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.summary-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px 28px; min-width: 320px;
}
.summary-card h3 { font-size: .82rem; color: var(--text2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .06em; }
.summary-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88rem;
}
.summary-row:last-child { border-bottom: none; }
.num-green { color: var(--green); font-weight: 700; }
.num-red   { color: var(--red);   font-weight: 700; }
.num-blue  { color: var(--blue);  font-weight: 700; }
.done-btns { display: flex; gap: 10px; }
.done-btn {
  padding: 9px 22px; font-size: .88rem; font-weight: 600; border: none;
  border-radius: 7px; cursor: pointer; transition: opacity .15s;
}
.done-btn:hover { opacity: .85; }
.done-btn-primary { background: linear-gradient(135deg, var(--green), var(--blue)); color: #fff; }
.done-btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 18px; font-size: .82rem; color: var(--text);
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9999;
  max-width: 420px; text-align: center;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ── Landing ── -->
<div id="landing">
  <h1>Book Review</h1>
  <p>逐一浏览书籍样图，确认保留或删除。可衔接 dup_review.csv 或直接使用 stats.csv。</p>
  <div class="land-card">
    <div class="file-row">
      <label>书籍 CSV（stats.csv 或 dup_review.csv）</label>
      <input type="file" id="csvInput" accept=".csv">
    </div>
    <div class="file-row">
      <label>书籍根目录</label>
      <div class="pick-row">
        <button class="pick-btn-sm" onclick="pickDir()">选择目录…</button>
        <span class="pick-status" id="dirStatus">未选择</span>
      </div>
    </div>
    <div class="file-row">
      <label>HTTP 模式（可选）— 用于访问文件名末尾含点/空格的目录</label>
      <input type="text" id="httpUrlInput" placeholder="http://localhost:8765"
             style="padding:7px 10px;background:var(--bg3);border:1px solid var(--border);
                    border-radius:6px;color:var(--text);font-size:.82rem;width:100%;outline:none;">
      <div id="httpCmd" style="font-size:.72rem;color:var(--text2);display:none;margin-top:2px">
        在书籍根目录运行：<code id="httpCmdText" style="color:var(--yellow);user-select:all"></code>
      </div>
    </div>
    <button class="land-btn" id="startBtn" disabled onclick="startReview()">开始审核</button>
  </div>
  <p style="font-size:.75rem;color:var(--text2)">键盘：D 删除 &nbsp;→ / Enter 下一个 &nbsp;Z 撤销</p>
</div>

<!-- ── Review ── -->
<div id="review">
  <div class="topbar">
    <span class="topbar-title">Book Review</span>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-label" id="progressLabel">0 / 0</span>
    </div>
    <button class="topbar-btn" onclick="undoLast()">撤销 Z</button>
    <button class="topbar-btn" onclick="exportCSV()">导出 CSV</button>
    <button class="topbar-btn" onclick="finishReview()">完成</button>
  </div>

  <div class="book-header">
    <div>
      <div class="book-title" id="bookTitle">—</div>
      <div class="book-sub"   id="bookSub">—</div>
    </div>
    <span class="status-badge status-keep" id="statusBadge">保留</span>
  </div>

  <div class="pairs-area" id="pairsArea"></div>

  <div class="action-bar">
    <button class="action-btn btn-undo"   onclick="undoLast()">↩ 撤销</button>
    <button class="action-btn btn-delete" onclick="deleteBook()">删除 D</button>
    <button class="action-btn btn-next"   onclick="nextBook()">下一个 →</button>
    <span class="key-hint">D 删除 &nbsp; → / Enter 下一个 &nbsp; Z 撤销</span>
  </div>
</div>

<!-- ── Done ── -->
<div id="done">
  <h1>审核完成</h1>
  <div class="summary-card">
    <h3>统计结果</h3>
    <div class="summary-row"><span>全部书籍</span>        <span class="num-blue"  id="doneTotal">—</span></div>
    <div class="summary-row"><span>保留</span>            <span class="num-green" id="doneKeep">—</span></div>
    <div class="summary-row"><span>删除</span>            <span class="num-red"   id="doneDel">—</span></div>
    <div class="summary-row"><span>本次审核</span>        <span id="doneReviewed">—</span></div>
    <div class="summary-row"><span>来自上游已删除</span>  <span id="donePreDel">—</span></div>
  </div>
  <div class="done-btns">
    <button class="done-btn done-btn-primary" onclick="exportCSV()">导出 book_review.csv</button>
    <button class="done-btn done-btn-outline" onclick="goBack()">返回继续审核</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════════════════════
let allBooks  = [];   // [{book, pairs, file, status}]
let todoBooks = [];   // indices into allBooks (status='keep')
let todoIdx   = 0;

let rootHandle = null;   // no pre-index; use getDirectoryHandle on demand
const bookHandleCache = new Map();

// HTTP mode — fallback for dirs with names ending in '.' or ' '
let httpMode    = false;
let httpBaseURL = '';

async function getBookHandle(name) {
  if (!name || !rootHandle) return null;
  // Cache hit — includes bad-name dirs pre-populated via entries() in pickDir()
  if (bookHandleCache.has(name)) return bookHandleCache.get(name);
  // Fallback: getDirectoryHandle (works for valid names only)
  for (const n of [name, name.normalize('NFC'), name.trim(), name.trim().normalize('NFC')]) {
    try {
      const h = await rootHandle.getDirectoryHandle(n);
      bookHandleCache.set(name, h); return h;
    } catch { }
  }
  bookHandleCache.set(name, null); return null;
}

// Blob URLs for the current book — revoked before loading next
let activeBlobUrls = [];

// History for undo: [{bi, prev}]
let history = [];
let reviewedCnt = 0;
let preDel      = 0;

// ══════════════════════════════════════════════════════════════════════════════
// CSV helpers
// ══════════════════════════════════════════════════════════════════════════════
function parseCSVRow(line) {
  const res = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += c;
  }
  res.push(cur); return res;
}
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = parseCSVRow(lines[0]).map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = parseCSVRow(line); const row = {};
    headers.forEach((h, i) => { row[h] = (vals[i] ?? '').trim(); });
    return row;
  });
}
function csvEscape(v) {
  v = String(v ?? '');
  if (v.includes(',') || v.includes('"') || v.includes('\n') || v.includes('\r'))
    return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

// ══════════════════════════════════════════════════════════════════════════════
// Inputs
// ══════════════════════════════════════════════════════════════════════════════
let _csv = false, _dir = false;
function checkReady() { document.getElementById('startBtn').disabled = !(_csv && _dir); }

document.getElementById('csvInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const rows = parseCSV(await f.text());
  const hasStatus = rows.length > 0 && 'status' in rows[0];
  allBooks = rows.map(r => ({
    book:   r.book   || '',
    pairs:  r.pairs  || '',
    file:   r.file   || '',
    status: hasStatus ? (r.status || 'keep') : 'keep',
  }));
  preDel = hasStatus ? allBooks.filter(b => b.status === 'delete').length : 0;
  // Auto-detect book root path for HTTP mode command hint
  const firstFile = allBooks.find(r => r.file)?.file;
  if (firstFile) {
    const bookRoot = firstFile.split('/').slice(0, -2).join('/');
    document.getElementById('httpCmdText').textContent =
      `python -m http.server 8765 --directory ${bookRoot}`;
    document.getElementById('httpCmd').style.display = 'block';
  }
  _csv = true; checkReady();
  showToast(`已加载 ${allBooks.length} 本书（上游已删 ${preDel} 本）`);
});

document.getElementById('httpUrlInput').addEventListener('input', e => {
  const v = e.target.value.trim().replace(/\/$/, '');
  httpMode    = v.length > 0;
  httpBaseURL = v;
});

async function pickDir() {
  if (!window.showDirectoryPicker) { showToast('需要 Chrome/Edge 浏览器'); return; }
  try {
    rootHandle = await window.showDirectoryPicker({ mode: 'read' });
    bookHandleCache.clear();
    const st = document.getElementById('dirStatus');
    st.textContent = `已选择：${rootHandle.name}，正在扫描子目录…`;
    st.className = 'pick-status';
    // Pre-populate cache via entries() — this handles dirs with names ending in '.' or ' '
    // which getDirectoryHandle() rejects due to Chrome's cross-platform filename validation.
    // entries() bypasses that check by returning OS-level handles directly.
    let scanned = 0;
    for await (const [name, h] of rootHandle.entries()) {
      if (h.kind === 'directory') { bookHandleCache.set(name, h); scanned++; }
    }
    st.textContent = `已选择：${rootHandle.name}（已扫描 ${scanned} 个子目录）`;
    st.className = 'pick-status ok';
    _dir = true; checkReady();
  } catch (e) {
    if (e.name !== 'AbortError') showToast('目录选择失败: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// Start
// ══════════════════════════════════════════════════════════════════════════════
function startReview() {
  todoBooks   = allBooks.map((b, i) => i).filter(i => allBooks[i].status === 'keep');
  todoIdx     = 0;
  reviewedCnt = 0;
  history     = [];
  document.getElementById('landing').style.display = 'none';
  document.getElementById('review').style.display  = 'flex';
  showBook();
}

// ══════════════════════════════════════════════════════════════════════════════
// Review core
// ══════════════════════════════════════════════════════════════════════════════
function currentBI() { return todoIdx < todoBooks.length ? todoBooks[todoIdx] : -1; }

async function showBook() {
  updateProgress();
  const bi = currentBI();
  if (bi < 0) { finishReview(); return; }
  const book = allBooks[bi];

  document.getElementById('bookTitle').textContent = book.book;
  document.getElementById('bookSub').textContent   =
    `${book.pairs} 图文对  ·  ${todoIdx + 1} / ${todoBooks.length}`;

  const badge = document.getElementById('statusBadge');
  badge.textContent  = book.status === 'delete' ? '删除' : '保留';
  badge.className    = 'status-badge ' + (book.status === 'delete' ? 'status-delete' : 'status-keep');

  revokeActive();
  await renderBookPairs(book.book);
}

function revokeActive() {
  for (const url of activeBlobUrls) URL.revokeObjectURL(url);
  activeBlobUrls = [];
}

async function renderBookPairs(bookName) {
  const area = document.getElementById('pairsArea');
  area.innerHTML = '<div class="pairs-loading">加载中…</div>';

  // ── Step 1: resolve statsRow (for direct JSON filename lookup) ──
  const bi = currentBI();
  const bookRow = bi >= 0 ? allBooks[bi] : null;

  // ── Step 2: get book directory handle ──
  const handle = await getBookHandle(bookName);
  if (!handle && !httpMode) {
    const hint = (bookName !== bookName.trim() || /\.$/.test(bookName))
      ? '（文件名末尾含点/空格，Chrome 无法访问此目录）'
      : '';
    area.innerHTML = `<div class="pairs-loading">未找到目录「${bookName}」${hint}</div>`; return;
  }
  if (!handle && httpMode && (!bookRow || !bookRow.file)) {
    area.innerHTML = `<div class="pairs-loading">「${bookName}」无 stats 记录，HTTP 模式无法加载</div>`; return;
  }

  // ── Step 3: get images directory ──
  let imagesHandle = null;
  if (handle) {
    for (const c of ['images', 'image', 'imgs']) {
      try { imagesHandle = await handle.getDirectoryHandle(c); break; } catch { }
    }
  }

  // ── Step 4: load pairs JSON — use file column for direct getFileHandle, no entries() scan ──
  let pairsData = [];
  if (bookRow && bookRow.file) {
    const jsonFileName = bookRow.file.split('/').pop();
    const candidates = [
      jsonFileName.replace(/^pairs_/, 'recaption_'),
      jsonFileName,
    ];
    if (handle) {
      for (const fname of candidates) {
        try {
          const fh = await handle.getFileHandle(fname);
          const d = JSON.parse(await (await fh.getFile()).text());
          pairsData = d.pairs || [];
          break;
        } catch { }
      }
    } else {
      // HTTP fallback
      for (const fname of candidates) {
        try {
          const url = `${httpBaseURL}/${encodeURIComponent(bookName)}/${fname}`;
          const resp = await fetch(url);
          if (resp.ok) { pairsData = (await resp.json()).pairs || []; break; }
        } catch { }
      }
    }
  } else if (handle) {
    // Fallback: iterate entries (book not in stats row)
    let gotRecaption = false;
    for await (const [fname, fh] of handle.entries()) {
      if (fh.kind !== 'file') continue;
      if (!gotRecaption && /^recaption_.*\.json$/i.test(fname)) {
        try { pairsData = JSON.parse(await (await fh.getFile()).text()).pairs || []; gotRecaption = true; } catch { }
      } else if (!gotRecaption && /^pairs_.*\.json$/i.test(fname)) {
        try { pairsData = JSON.parse(await (await fh.getFile()).text()).pairs || []; } catch { }
      }
    }
  }

  area.innerHTML = '';

  if (pairsData.length === 0) {
    area.innerHTML = '<div class="pairs-loading">未找到图文对数据</div>'; return;
  }

  for (const pair of pairsData) {
    const card = document.createElement('div');
    card.className = 'pair-card';

    const imgRow = document.createElement('div');
    imgRow.className = 'pair-imgs';
    let loadedAny = false;
    for (const fname of (pair.images || []).slice(0, 3)) {
      if (handle && imagesHandle) {
        try {
          const fh = await imagesHandle.getFileHandle(fname);
          const file = await fh.getFile();
          const url = URL.createObjectURL(file);
          activeBlobUrls.push(url);
          const img = document.createElement('img');
          img.src = url; img.alt = fname; img.loading = 'lazy';
          imgRow.appendChild(img);
          loadedAny = true;
        } catch { }
      } else if (httpMode) {
        const img = document.createElement('img');
        img.src = `${httpBaseURL}/${encodeURIComponent(bookName)}/images/${fname}`;
        img.alt = fname; img.loading = 'lazy';
        imgRow.appendChild(img);
        loadedAny = true;
      }
    }
    if (!loadedAny) {
      const ph = document.createElement('div');
      ph.className = 'pair-placeholder'; ph.textContent = '图片未找到';
      imgRow.appendChild(ph);
    }
    card.appendChild(imgRow);

    const text = (pair.text || pair.caption || '').trim();
    if (text) {
      const td = document.createElement('div');
      td.className = 'pair-text'; td.textContent = text;
      card.appendChild(td);
    }
    area.appendChild(card);
  }
}

function deleteBook() {
  const bi = currentBI(); if (bi < 0) return;
  history.push({ bi, prev: allBooks[bi].status });
  allBooks[bi].status = 'delete';
  reviewedCnt++;
  todoIdx++;
  showToast(`已删除「${allBooks[bi].book}」`);
  showBook();
}

function nextBook() {
  const bi = currentBI(); if (bi < 0) return;
  history.push({ bi, prev: allBooks[bi].status });
  reviewedCnt++;
  todoIdx++;
  showBook();
}

function undoLast() {
  if (history.length === 0) { showToast('无可撤销操作'); return; }
  const { bi, prev } = history.pop();
  allBooks[bi].status = prev;
  const pos = todoBooks.indexOf(bi);
  todoIdx = pos >= 0 ? pos : Math.max(0, todoIdx - 1);
  reviewedCnt = Math.max(0, reviewedCnt - 1);
  showToast('已撤销');
  showBook();
}

function updateProgress() {
  const total = todoBooks.length;
  const pct   = total > 0 ? Math.round(todoIdx / total * 100) : 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${todoIdx} / ${total}`;
}

// ══════════════════════════════════════════════════════════════════════════════
// Finish
// ══════════════════════════════════════════════════════════════════════════════
function finishReview() {
  revokeActive();
  const kept = allBooks.filter(b => b.status !== 'delete').length;
  const del  = allBooks.length - kept;
  document.getElementById('review').style.display = 'none';
  document.getElementById('done').style.display   = 'flex';
  document.getElementById('doneTotal').textContent    = allBooks.length;
  document.getElementById('doneKeep').textContent     = kept;
  document.getElementById('doneDel').textContent      = del;
  document.getElementById('doneReviewed').textContent = reviewedCnt;
  document.getElementById('donePreDel').textContent   = preDel;
}

function goBack() {
  document.getElementById('done').style.display   = 'none';
  document.getElementById('review').style.display = 'flex';
  showBook();
}

// ══════════════════════════════════════════════════════════════════════════════
// Export
// ══════════════════════════════════════════════════════════════════════════════
function exportCSV() {
  const keeps = allBooks.filter(b => b.status !== 'delete');
  const dels  = allBooks.filter(b => b.status === 'delete');
  const header = 'book,pairs,file,status\n';
  const lines  = [];
  for (const r of keeps) lines.push([r.book, r.pairs, r.file, 'keep'].map(csvEscape).join(','));
  lines.push('');
  for (const r of dels)  lines.push([r.book, r.pairs, r.file, 'delete'].map(csvEscape).join(','));
  const blob = new Blob([header + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'book_review.csv' });
  a.click(); URL.revokeObjectURL(a.href);
  showToast(`已导出 book_review.csv（保留 ${keeps.length}，删除 ${dels.length}，共 ${allBooks.length} 条）`);
}

// ══════════════════════════════════════════════════════════════════════════════
// Toast + keyboard
// ══════════════════════════════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => {
  if (document.getElementById('review').style.display !== 'flex') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'd' || e.key === 'D')                    deleteBook();
  else if (e.key === 'ArrowRight' || e.key === 'Enter')  nextBook();
  else if (e.key === 'z' || e.key === 'Z')               undoLast();
});
</script>
